<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>workoutboard · Area 76</title>
<style>
:root{color-scheme:dark;--accent:#ff4b55}*{box-sizing:border-box}body{margin:0;background:#101114;color:#f6f6f6;font-family:Arial,Helvetica,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit;background:#25272d;border:1px solid #41444d;border-radius:12px;padding:14px 20px}button:hover,button:focus-visible{background:#343741;outline:2px solid var(--accent)}[hidden]{display:none!important}.brand{display:flex;align-items:center;gap:14px}.badge{background:#ee3947;color:white;font-weight:900;font-size:29px;padding:12px;border-radius:12px}.name{font-size:25px;font-weight:800;letter-spacing:-1px}.subtitle{color:#a6a9b2;font-size:12px;letter-spacing:2px;margin-top:5px}.gate{max-width:420px;margin:7vh auto;padding:24px}.gate .brand{justify-content:center}.gate h1{text-align:center;font-size:21px;margin:35px 0 20px}.pin{height:58px;text-align:center;font-size:35px;letter-spacing:16px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.keys button{font-size:32px;height:80px}.keys .small{font-size:17px}.error{min-height:28px;color:#ff858a;text-align:center}.shell{padding:28px 38px;max-width:2200px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:20px}.actions{display:flex;gap:10px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:32px 0 14px;flex-wrap:wrap}.courses{display:flex;gap:10px;flex-wrap:wrap}.course{font-weight:800;border-color:var(--color);color:var(--color)}.course[aria-pressed=true]{background:var(--color);color:#101114}.datebox{display:flex;align-items:center;gap:12px}.datebox input{color:white;background:#25272d;border:1px solid #41444d;border-radius:10px;padding:13px}.status{font-size:13px;color:#a6a9b2;min-height:22px}.title{font-size:clamp(28px,3vw,54px);margin:26px 0 8px;letter-spacing:-1px;color:var(--accent)}.focus{font-size:21px;color:#bfc2ca;margin:0 0 24px}.blocks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.block{border:1px solid #333640;border-top:4px solid var(--accent);border-radius:14px;background:#1b1d22;padding:24px}.block.warmup{grid-column:1/-1;border-top-color:#626875}.block h2{margin:0 0 18px;font-size:19px;color:var(--accent);text-transform:uppercase;letter-spacing:2px}.block p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:clamp(20px,1.8vw,34px);line-height:1.42;margin:0}.empty{padding:50px 24px;text-align:center;color:#a6a9b2;border:1px dashed #444;border-radius:14px;font-size:21px}.jump{margin-top:20px}.tv header,.tv .toolbar,.tv .status{display:none}.tv .shell{padding:22px}.tv .title{margin-top:0}.exit-tv{position:fixed;right:18px;bottom:18px;opacity:.4;z-index:3}.exit-tv:hover,.exit-tv:focus-visible{opacity:1}footer{font-size:12px;color:#717680;margin-top:28px}@media(max-width:900px){.blocks{grid-template-columns:1fr}.shell{padding:22px}.toolbar{align-items:flex-start}header{flex-wrap:wrap}.block p{font-size:23px}.actions button{padding:11px}.datebox{flex-wrap:wrap}}@media(min-width:1800px){.block p{font-size:36px}}
</style>
</head>
<body>
<section id="gate" class="gate">
<div class="brand"><span class="badge">76</span><div><div class="name">workoutboard</div><div class="subtitle">GLADIATOR AREA 76</div></div></div>
<h1>Zugangscode eingeben</h1><div id="pin" class="pin" aria-label="Eingegebener Code" aria-live="polite"></div>
<p id="error" class="error" role="status"></p><div id="keys" class="keys"></div>
</section>
<main id="board" class="shell" hidden>
<header><div class="brand"><span class="badge">76</span><div><div class="name">workoutboard</div><div class="subtitle">GLADIATOR AREA 76</div></div></div><div class="actions"><button id="refresh">Aktualisieren</button><button id="tv">TV-Ansicht</button><button id="lock">Sperren</button></div></header>
<div class="toolbar"><div class="courses"><button class="course" data-course="HYBRID" style="--color:#ff4b55">HYBRID</button><button class="course" data-course="HYROX" style="--color:#f3ce41">HYROX</button><button class="course" data-course="HYROX Youngstars" style="--color:#ba8aff">HYROX Youngstars</button></div><label class="datebox">Datum <input id="date" type="date"></label></div>
<div id="status" class="status" role="status"></div><h1 id="title" class="title"></h1><p id="focus" class="focus"></p><div id="blocks" class="blocks"></div><footer>Gladiator Area 76 · workoutboard</footer>
</main>
<button id="exitTv" class="exit-tv" hidden>TV-Ansicht verlassen</button>
<script>
'use strict';
// Einfache sichtbare Zugangssperre. Kein vertrauliches Passwort verwenden.
const ACCESS_CODE='76';
const SHEET_ID='1SW9RKdqyKcVAP6oz2fP5GgTbV4m1hOTDkeHH6N6CMeM';
const SOURCES=[{gid:20261102,name:'HYBRID / HYROX'},{gid:501200796,name:'Youngstars'}];
const COLORS={'HYBRID':'#ff4b55','HYROX':'#f3ce41','HYROX Youngstars':'#ba8aff'};
const $=id=>document.getElementById(id);
let pin='',unlocked=false,course='HYBRID',busy=false,sequence=0,timer=null;
const data=new Map();
function today(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const get=k=>p.find(x=>x.type===k).value;return `${get('year')}-${get('month')}-${get('day')}`;}
$('date').value=today();
function digit(value){if(unlocked)return;if(value==='delete'){pin=pin.slice(0,-1);}else if(value==='clear'){pin='';}else{pin+=value;} $('pin').textContent='●'.repeat(pin.length);$('error').textContent='';if(pin.length===ACCESS_CODE.length){if(pin===ACCESS_CODE){unlock();}else{pin='';$('pin').textContent='';$('error').textContent='Code stimmt nicht. Bitte erneut eingeben.';}}}
['1','2','3','4','5','6','7','8','9','clear','0','delete'].forEach(value=>{const b=document.createElement('button');b.textContent=value==='clear'?'Löschen':value==='delete'?'⌫':value;b.type='button';if(value.length>1)b.className='small';b.setAttribute('aria-label',value==='delete'?'Letzte Zahl löschen':b.textContent);b.onclick=()=>digit(value);$('keys').append(b);});
document.addEventListener('keydown',e=>{if(!unlocked){if(/^\d$/.test(e.key)){e.preventDefault();digit(e.key);}if(e.key==='Backspace'){e.preventDefault();digit('delete');}}else if(e.key==='Escape'){setTV(false);}});
function unlock(){unlocked=true;pin='';$('pin').textContent='';$('gate').hidden=true;$('board').hidden=false;render();refresh();timer=setInterval(refresh,60000);}
$('lock').onclick=()=>{unlocked=false;clearInterval(timer);setTV(false);$('board').hidden=true;$('gate').hidden=false;data.clear();};
function setTV(on){document.body.classList.toggle('tv',on);$('exitTv').hidden=!on;}
$('tv').onclick=()=>setTV(true);$('exitTv').onclick=()=>setTV(false);
$('date').onchange=render;
document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>{course=b.dataset.course;render();});
function cellText(c){if(!c)return '';if(c.f!=null)return String(c.f);if(c.v==null)return '';const match=/^Date\((\d+),(\d+),(\d+)/.exec(String(c.v));if(match)return `${match[3].padStart(2,'0')}.${String(+match[2]+1).padStart(2,'0')}.${match[1]}`;return String(c.v);}
function readSheet(gid){return new Promise((resolve,reject)=>{const name='workoutboardData'+(++sequence),script=document.createElement('script');let timeout;const clean=()=>{clearTimeout(timeout);script.remove();delete window[name];};window[name]=response=>{clean();if(response.status==='error'||!response.table){reject(new Error('Sheet nicht erreichbar'));return;}resolve(response.table.rows.map(r=>(r.c||[]).map(cellText)));};script.onerror=()=>{clean();reject(new Error('Verbindung fehlgeschlagen'));};timeout=setTimeout(()=>{clean();reject(new Error('Zeitüberschreitung'));},20000);script.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${gid}&headers=0&tqx=${encodeURIComponent('out:json;responseHandler:'+name)}&_=${Date.now()}`;document.head.append(script);});}
const placeholder=t=>!t?.trim()||/^\s*\[.*\]\s*$/s.test(t);
function isoDate(text){const m=/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(text.trim());if(!m)return null;const iso=`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`,d=new Date(iso+'T12:00:00Z');return !isNaN(d)&&d.toISOString().slice(0,10)===iso?iso:null;}
function extractWorkouts(rows){const entries=[];let seen=false;for(let i=0;i<rows.length;i++){if(rows[i][0]?.trim()!=='Datum')continue;seen=true;const fields={};for(let j=i+1;j<rows.length&&rows[j][0]?.trim()!=='Datum';j++){const label=rows[j][0]?.trim();if(label)fields[label]=rows[j];}if(!fields.Kurs||!fields['Series A']||!fields['Veröffentlichen'])throw new Error('Tabellenstruktur prüfen');for(let col=1;col<rows[i].length;col++){const date=isoDate(rows[i][col]||''),c=fields.Kurs[col]?.trim();if(!date||!COLORS[c])continue;const a=fields['Series A'][col]||'',published=/^(true|wahr|ja)$/i.test(fields['Veröffentlichen'][col]?.trim()||'')&&!placeholder(a);const entry={date,course:c,published};if(published){entry.focus=placeholder(fields.Fokus?.[col])?'':fields.Fokus[col].trim();entry.blocks=['Warm-Up','Series A','Series B','Series C'].flatMap(label=>{const t=fields[label]?.[col]||'';return placeholder(t)?[]:[{title:label,text:t.trim()}];});}entries.push(entry);}}if(!seen)throw new Error('Keine Datumsblöcke gefunden');return entries;}
async function refresh(){if(busy||!unlocked)return;busy=true;$('refresh').disabled=true;$('status').textContent='Workouts werden aktualisiert …';const results=await Promise.allSettled(SOURCES.map(async source=>{const workouts=extractWorkouts(await readSheet(source.gid));return {...source,workouts,updated:new Date()};}));if(unlocked){results.forEach((r,i)=>{if(r.status==='fulfilled')data.set(SOURCES[i].gid,r.value);});render();const failed=results.flatMap((r,i)=>r.status==='rejected'?[SOURCES[i].name]:[]);const timestamp=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Berlin'});$('status').textContent=failed.length?`Keine aktuellen Daten für ${failed.join(' und ')}. Vorhandene Daten bleiben sichtbar. Erneut auf Aktualisieren klicken.`:`Aktualisiert ${timestamp} · automatische Aktualisierung jede Minute`;}$('refresh').disabled=false;busy=false;}
$('refresh').onclick=refresh;
function render(){document.documentElement.style.setProperty('--accent',COLORS[course]);document.querySelectorAll('[data-course]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.course===course)));const date=$('date').value;const formatted=date?new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(date+'T12:00:00Z')):'Datum wählen';$('title').textContent=course+' · '+formatted;$('focus').textContent='';$('blocks').replaceChildren();const source=data.get(course==='HYROX Youngstars'?501200796:20261102),entry=source?.workouts.find(w=>w.date===date&&w.course===course);if(entry?.published){$('focus').textContent=entry.focus;for(const b of entry.blocks){const article=document.createElement('article');article.className='block'+(b.title==='Warm-Up'?' warmup':'');const h=document.createElement('h2'),p=document.createElement('p');h.textContent=b.title;p.textContent=b.text;article.append(h,p);$('blocks').append(article);}return;}const empty=document.createElement('div');empty.className='empty';empty.style.gridColumn='1 / -1';const message=document.createElement('div');message.textContent=!source?'Workouts werden geladen …':entry?'Für diesen Kurs ist noch kein Workout freigegeben.':'Für diesen Tag ist kein Workout geplant.';empty.append(message);const first=source?.workouts.filter(w=>w.course===course&&w.published).sort((a,b)=>a.date.localeCompare(b.date))[0];if(first&&first.date!==date){const b=document.createElement('button');b.className='jump';b.textContent='Zum ersten freigegebenen Workout';b.onclick=()=>{$('date').value=first.date;render();};empty.append(b);}$('blocks').append(empty);}
</script>
</body>
